name: Refresh public trial codes

on:
  push:
    branches: [feat/sales-intelligence-demo]
    paths:
      - "src/scripts/refresh-trial-codes.ts"
      - ".github/workflows/refresh-trial-codes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Replace the 20 public trial codes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx src/scripts/refresh-trial-codes.ts
